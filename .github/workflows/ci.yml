name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no database. Kept separate from the matrix so the
  # formatting, vet and unit-test verdict is reported once, not twice.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./... -count=1
      # Twice in one process. Task 7 found a sql.Register call on a path that
      # ran per invocation, which panics with "called twice for driver" the
      # second time and is invisible to a -count=1 run. The whole class costs a
      # second to guard against.
      - run: go test ./collect/ -count=2
      # The release workflow cross-compiles for these two targets. Finding out
      # at tag time that one of them does not build is finding out too late.
      - name: cross-compile
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/sql-auditor
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/sql-auditor
      # The embedded corpus has to survive the round trip to disk, because
      # --queries-dir runs it that way. Compare the export against the tree it
      # was embedded from rather than against a constant: a literal count goes
      # stale the first time a collector is added, and it goes stale by passing
      # nothing — it fails a run that was fine, which teaches everyone to edit
      # the number rather than read the failure.
      - name: queries export round trip
        run: |
          go run ./cmd/sql-auditor queries export --to "$RUNNER_TEMP/corpus"
          (cd queries && find . -name '*.sql' | sort) > "$RUNNER_TEMP/embedded.txt"
          (cd "$RUNNER_TEMP/corpus" && find . -name '*.sql' | sort) > "$RUNNER_TEMP/exported.txt"
          diff -u "$RUNNER_TEMP/embedded.txt" "$RUNNER_TEMP/exported.txt"
          test -s "$RUNNER_TEMP/embedded.txt"

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2017 is the oldest image Microsoft publishes, so it is the oldest
        # version that can be tested automatically at all. The supported floor
        # is 2012 and is verified by hand — see docs/verification-2012.md.
        mssql: ["2017-latest", "2022-latest"]
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.mssql }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
        ports: ["1433:1433"]
    env:
      SQL_SERVER: localhost,1433
      SQL_USER: sa
      SQL_PASSWORD: "Str0ng!Passw0rd"
      # SQL_TRUST_SERVER_CERTIFICATE defaults to false, which is the right
      # default for an operator: encrypting to a certificate nobody validated
      # is indistinguishable from encrypting to a machine-in-the-middle. The
      # mssql image generates its own self-signed certificate at first start,
      # so every run of this job would meet exactly that x509 failure and stop
      # at `check`. What the setting protects — a login travelling a network
      # someone else can reach — does not exist here: the instance is a
      # container on the runner's own loopback, its password is three lines
      # above in a public file, and both are destroyed with the job. Saying so
      # here keeps the product default honest instead of loosening it for
      # everyone to spare the CI.
      SQL_TRUST_SERVER_CERTIFICATE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A service container is "started" as soon as the process is up, which is
      # well before SQL Server accepts logins. Retrying a statement that also
      # creates the user database collapses the wait and the fixture into one
      # step: without a user database, the four per-database collectors have
      # nothing to run against and would silently never be exercised.
      - name: wait for SQL Server and create a user database
        run: |
          for attempt in $(seq 1 40); do
            if docker run --rm --network host mcr.microsoft.com/mssql-tools \
                 /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "$SQL_PASSWORD" -l 5 \
                 -Q "IF DB_ID('ci_probe') IS NULL CREATE DATABASE ci_probe;"; then
              echo "instance is up after $attempt attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "SQL Server did not become reachable" >&2
          docker ps -a
          exit 1
      # 80.workload/026 classifies interrupted executions from the Query Store,
      # and an empty store proves nothing about that: every total is zero
      # whatever the collector filters on. So the store is switched on for
      # ci_probe, capture mode ALL (under AUTO a first execution may not be
      # captured), and one statement is stopped by a client timeout while
      # another fails. Both sqlcmd calls are expected to fail. The statement
      # has to be one the optimizer cannot shortcut: a bare COUNT_BIG over a
      # triple cross join of sys.all_columns finished in about a second on
      # the runners, since the rows are counted, not enumerated, and a
      # one-second timeout then fired or not by chance. The CHECKSUM
      # predicate makes every one of the trillion-odd rows be evaluated.
      - name: plant an aborted and a failed execution
        run: |
          tools() { docker run --rm --network host mcr.microsoft.com/mssql-tools \
            /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "$SQL_PASSWORD" -d ci_probe "$@"; }
          tools -Q "ALTER DATABASE ci_probe SET QUERY_STORE = ON (OPERATION_MODE = READ_WRITE, QUERY_CAPTURE_MODE = ALL);"
          tools -t 2 -Q "SELECT COUNT_BIG(*) FROM sys.all_columns AS a CROSS JOIN sys.all_columns AS b CROSS JOIN sys.all_columns AS c WHERE CHECKSUM(a.name, b.name, c.name) = 0 OPTION (MAXDOP 1);" || true
          tools -Q "SELECT 1 / (object_id - object_id) FROM sys.objects;" || true
      # 80.workload/029 leaves out of its totals the queries of scalar and
      # multi-statement functions and of triggers, each recorded twice, and
      # reports per interval what it left out. A scalar function whose body
      # runs a query, called once per row, plants such a query. GETDATE() in
      # the body keeps the 2019 inlining away on the 2022 leg (is_inlineable
      # 0, checked on SQL Server 2025), since an inlined function records no
      # query of its own; the 2017 leg never inlines. It is called once per
      # row of sys.all_columns, some ten thousand rows, so its executions
      # outnumber everything else ci_probe runs before 029 reads the store
      # (12,803 against 172 on SQL Server 2025, the whole corpus included, in
      # under four seconds), and a total that counted them would show it.
      - name: plant a nested function query
        run: |
          tools() { docker run --rm --network host mcr.microsoft.com/mssql-tools \
            /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "$SQL_PASSWORD" -d ci_probe -b "$@"; }
          tools -Q "CREATE FUNCTION dbo.ci_nested (@n int) RETURNS int AS BEGIN DECLARE @c int; SELECT @c = COUNT(*) FROM sys.objects WHERE object_id > @n AND create_date < GETDATE(); RETURN @c; END;"
          tools -Q "SELECT SUM(dbo.ci_nested(object_id)) FROM sys.all_columns;"

      # 80.workload/027 lists the indexes the stored plans READ, and the whole
      # point is what it leaves out: an index that is only maintained. Its
      # name appears in the UPDATE's plan as an Object of the Update element,
      # so a shred through //Object would list it as read and veto its own
      # drop. One index is sought and one only updated, so the assertion on
      # 027 below can require the first and refuse the second; an empty list
      # would make both clauses vacuous.
      - name: plant an index read and an index only maintained
        run: |
          docker run --rm --network host mcr.microsoft.com/mssql-tools \
            /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "$SQL_PASSWORD" -d ci_probe -b -Q "
              CREATE TABLE dbo.ix_probe (id int NOT NULL PRIMARY KEY, r int NOT NULL, w int NOT NULL);
              INSERT dbo.ix_probe (id, r, w)
                SELECT TOP (1000) ROW_NUMBER() OVER (ORDER BY (SELECT 1)), 0, 0 FROM sys.all_columns;
              CREATE INDEX ix_probe_read ON dbo.ix_probe (r);
              CREATE INDEX ix_probe_written ON dbo.ix_probe (w);
              EXEC sys.sp_executesql N'SELECT id FROM dbo.ix_probe WHERE r = 5;';
              EXEC sys.sp_executesql N'UPDATE dbo.ix_probe SET w = w + 1 WHERE id = 7;';"
      # 70.schema/010.objects lists untrusted constraints with
      # is_not_for_replication, which is what tells a constraint a
      # revalidation can fix from one it cannot: NOT FOR REPLICATION makes a
      # foreign key untrusted from birth. Without one planted, the list is
      # empty and its shape is never seen.
      - name: plant a NOT FOR REPLICATION foreign key
        run: |
          docker run --rm --network host mcr.microsoft.com/mssql-tools \
            /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "$SQL_PASSWORD" -d ci_probe -b -Q "
              CREATE TABLE dbo.nfr_parent (id int NOT NULL PRIMARY KEY);
              CREATE TABLE dbo.nfr_child (id int NOT NULL PRIMARY KEY, parent_id int NOT NULL
                CONSTRAINT fk_nfr_child_parent REFERENCES dbo.nfr_parent (id) NOT FOR REPLICATION);"

      # 095 lists the procedures master runs at startup and 40.security/040
      # resolves each database key to the certificate that protects it. Both
      # arrays are empty on a fresh container, and an empty array is also what
      # a broken join or a misspelt column returns, so one of each is planted:
      # a procedure flagged with sp_procoption, and a database key on ci_probe
      # under a certificate whose private key was never backed up. Encryption
      # is not turned on, which would encrypt tempdb; the key alone puts the
      # row in sys.dm_database_encryption_keys. The container dies with the job.
      - name: plant a startup procedure and a database encryption key
        run: |
          tools() { docker run --rm --network host mcr.microsoft.com/mssql-tools \
            /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "$SQL_PASSWORD" -b "$@"; }
          tools -d master -Q "CREATE PROCEDURE dbo.ci_startup_probe AS SET NOCOUNT ON;"
          tools -d master -Q "EXEC sp_procoption N'dbo.ci_startup_probe', 'startup', 'on';"
          tools -d master -Q "CREATE MASTER KEY ENCRYPTION BY PASSWORD = 'Ci!MasterKey0'; CREATE CERTIFICATE ci_tde_probe WITH SUBJECT = 'ci tde probe';"
          tools -d ci_probe -Q "CREATE DATABASE ENCRYPTION KEY WITH ALGORITHM = AES_256 ENCRYPTION BY SERVER CERTIFICATE ci_tde_probe;"
      # 50.agent/050 reads Ola Hallengren's dbo.CommandLog wherever it is
      # installed, and no instance has one unless somebody installed it. The
      # published table definition goes into ci_probe with three rows: a
      # REORGANIZE that finished, the same REORGANIZE started an hour ago and
      # never ended, and a statistics update logged after it, which is what
      # tells a command cut off from one still running.
      # One statement per sqlcmd call: the 2017 mssql-tools image corrupts a
      # -Q string near 1 KB, and the whole plant in one call failed there.
      - name: plant a maintenance solution CommandLog
        run: |
          tools() { docker run --rm --network host mcr.microsoft.com/mssql-tools \
            /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "$SQL_PASSWORD" -d ci_probe -b "$@"; }
          tools -Q "
              CREATE TABLE dbo.CommandLog (ID int IDENTITY(1,1) NOT NULL, DatabaseName sysname NULL,
                SchemaName sysname NULL, ObjectName sysname NULL, ObjectType char(2) NULL,
                IndexName sysname NULL, IndexType tinyint NULL, StatisticsName sysname NULL,
                PartitionNumber int NULL, ExtendedInfo xml NULL, Command nvarchar(max) NOT NULL,
                CommandType nvarchar(60) NOT NULL, StartTime datetime2(7) NOT NULL,
                EndTime datetime2(7) NULL, ErrorNumber int NULL, ErrorMessage nvarchar(max) NULL,
                CONSTRAINT PK_CommandLog PRIMARY KEY CLUSTERED (ID ASC));"
          tools -Q "
              INSERT dbo.CommandLog (DatabaseName, SchemaName, ObjectName, ObjectType, IndexName,
                IndexType, PartitionNumber, ExtendedInfo, Command, CommandType, StartTime, EndTime, ErrorNumber)
              VALUES (N'ci_probe', N'dbo', N'ix_probe', 'U', N'ix_probe_read', 2, 1,
                N'<ExtendedInfo><PageCount>50000</PageCount><Fragmentation>12.5</Fragmentation></ExtendedInfo>',
                N'ALTER INDEX [ix_probe_read] ON [ci_probe].[dbo].[ix_probe] REORGANIZE WITH (LOB_COMPACTION = ON)',
                N'ALTER_INDEX', DATEADD(HOUR, -26, SYSDATETIME()), DATEADD(HOUR, -25, SYSDATETIME()), 0);"
          tools -Q "
              INSERT dbo.CommandLog (DatabaseName, SchemaName, ObjectName, ObjectType, IndexName,
                IndexType, PartitionNumber, ExtendedInfo, Command, CommandType, StartTime, EndTime, ErrorNumber)
              VALUES (N'ci_probe', N'dbo', N'ix_probe', 'U', N'ix_probe_read', 2, 1,
                N'<ExtendedInfo><PageCount>50000</PageCount><Fragmentation>12.5</Fragmentation></ExtendedInfo>',
                N'ALTER INDEX [ix_probe_read] ON [ci_probe].[dbo].[ix_probe] REORGANIZE WITH (LOB_COMPACTION = ON)',
                N'ALTER_INDEX', DATEADD(HOUR, -2, SYSDATETIME()), NULL, NULL);"
          tools -Q "
              INSERT dbo.CommandLog (DatabaseName, SchemaName, ObjectName, ObjectType, StatisticsName,
                Command, CommandType, StartTime, EndTime, ErrorNumber)
              VALUES (N'ci_probe', N'dbo', N'ix_probe', 'U', N'ix_probe_written',
                N'UPDATE STATISTICS [ci_probe].[dbo].[ix_probe] [ix_probe_written] WITH FULLSCAN',
                N'UPDATE_STATISTICS', DATEADD(HOUR, -1, SYSDATETIME()), DATEADD(MINUTE, -59, SYSDATETIME()), 0);"
      # 60.backup/010 groups the backup destinations by directory, and until
      # October 2026 it found the directory by the last backslash, so a Linux
      # path, which is what these containers write, came back once per file.
      # Two full backups of model into one directory have to come back as one
      # destination with two names. model, because ci_probe must keep having
      # no full backup for the differential base assertion below, and nothing
      # here reads model's chain.
      - name: plant two backups into one directory
        run: |
          tools() { docker run --rm --network host mcr.microsoft.com/mssql-tools \
            /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "$SQL_PASSWORD" -b "$@"; }
          tools -Q "BACKUP DATABASE model TO DISK = N'/var/opt/mssql/data/ci_model_1.bak' WITH INIT, COPY_ONLY;"
          tools -Q "BACKUP DATABASE model TO DISK = N'/var/opt/mssql/data/ci_model_2.bak' WITH INIT, COPY_ONLY;"
      # 80.workload/030 names the column a cached plan converts to nvarchar,
      # and the form it exists for is the silent one: a varchar column under a
      # Windows collation, sought with nvarchar parameters, which the engine
      # turns into a range seek with no PlanAffectingConvert warning and the
      # conversion of both columns left in the residual predicate (measured on
      # SQL Server 2025). The predicate also converts the two parameters, so a
      # reading that took any ColumnReference would count four and could name
      # @p. Five thousand executions put the statement among the heaviest by
      # logical reads, since 030 looks only at a window of the heaviest
      # statements (2 500) and reads at most 1 000 candidates out of it. One
      # statement per sqlcmd call, for the 1 KB limit above.
      # THIS STEP IS LAST, just before the collection, because what it plants
      # lives in the plan cache and sp_procoption empties it: the procedure
      # ends with RECONFIGURE WITH OVERRIDE, and on SQL Server 2017
      # (14.0.3550.4) that flushes every cached plan, measured as 12 plans
      # before the call and none after. Planted before the startup procedure,
      # as it was until 4 October 2026, the statement was gone by the time 030
      # read the cache, and the 2017 leg failed on a file holding no ic_probe
      # row; the 2022 leg kept it. Anything else the cache must hold goes here
      # too, after every step that may reconfigure.
      - name: plant an implicit conversion of an indexed column
        run: |
          tools() { docker run --rm --network host mcr.microsoft.com/mssql-tools \
            /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "$SQL_PASSWORD" -d ci_probe -b "$@"; }
          tools -Q "CREATE TABLE dbo.ic_probe (id int IDENTITY PRIMARY KEY, code varchar(20) COLLATE Latin1_General_CI_AS NOT NULL, region varchar(10) COLLATE Latin1_General_CI_AS NOT NULL);"
          tools -Q "INSERT dbo.ic_probe (code, region) SELECT TOP (1000) CONCAT('c', ROW_NUMBER() OVER (ORDER BY (SELECT 1))), CONCAT('r', ROW_NUMBER() OVER (ORDER BY (SELECT 1)) % 10) FROM sys.all_columns;"
          tools -Q "CREATE INDEX ic_probe_code ON dbo.ic_probe (code, region);"
          tools -Q "SET NOCOUNT ON; DECLARE @i int = 0; WHILE @i < 5000 BEGIN EXEC sys.sp_executesql N'SELECT id FROM dbo.ic_probe WHERE code = @p AND region = @r;', N'@p nvarchar(20), @r nvarchar(10)', N'c5', N'r5'; SET @i += 1; END;" > /dev/null
      # --env /dev/null is not decoration. Configuration precedence is
      # flag > .env > process environment, so a .env file appearing in the
      # workspace — generated, or committed by accident — would outrank the
      # credentials set above and point every leg of the matrix at some other
      # server while the job still went green. Reading an empty file instead
      # makes that impossible.
      - name: check
        run: go run ./cmd/sql-auditor check --env /dev/null
      - name: collect
        # --query-store-compare-at runs 025, which no other option reaches.
        # Yesterday is over in any zone the container may run in.
        run: |
          go run ./cmd/sql-auditor collect --env /dev/null --output-dir "$RUNNER_TEMP/out" \
            --query-store-compare-at "$(date -u -d yesterday +%F)"
      # collect exits 0 on a clean run, but an empty run also exits 0 if the
      # corpus somehow produced nothing. Assert on the artefacts instead: the
      # per-database results below are the ones a missing fixture would drop.
      # 70.schema/021 is @min_version 15, so it exists on one leg of this
      # matrix and not the other, and the assertion has to say which rather
      # than guess: added to the block below, which asserts files present on
      # both legs, it would turn the 2017 leg red. On 2022 the file is there
      # with its pre-cap counts; on 2017 the run records the skip and its
      # reason, which is the half that proves the gate works.
      - name: assert the per-query missing index file (2022)
        if: matrix.mssql == '2022-latest'
        run: |
          run_dir="$(find "$RUNNER_TEMP/out" -mindepth 1 -maxdepth 1 -type d)"
          f="$run_dir/70.schema/ci_probe/021.missing-index-queries.json"
          jq -e 'has("counts")
                 and (.counts | has("rows_before_cap")
                      and has("suggestions_with_queries_before_cap")
                      and has("distinct_query_hashes_before_cap"))
                 and .listing_cap_per_suggestion == 20
                 and (.queries | type) == "array"
                 and all(.queries[]; has("query_hash") and (has("last_sql_handle") | not))' "$f" \
            || { jq 'del(.queries)' "$f"; exit 1; }
      - name: assert the per-query missing index file is skipped (2017)
        if: matrix.mssql == '2017-latest'
        run: |
          run_dir="$(find "$RUNNER_TEMP/out" -mindepth 1 -maxdepth 1 -type d)"
          test ! -f "$run_dir/70.schema/ci_probe/021.missing-index-queries.json"
          jq -e '[.skipped_scripts[]? | select(.script == "70.schema/021.missing-index-queries.sql")] | length >= 1' \
            "$run_dir/_run.json" \
            || { jq '[.skipped_scripts[]? | select(.script | test("021"))]' "$run_dir/_run.json"; exit 1; }
      # 20.databases/013 is @min_version 15 like 70.schema/021, so it is
      # asserted per leg for the same reason. tempdb is the row the ADR topic
      # reads, and a renamed alias would leave the key absent and type null.
      - name: assert accelerated database recovery per database (2022)
        if: matrix.mssql == '2022-latest'
        run: |
          run_dir="$(find "$RUNNER_TEMP/out" -mindepth 1 -maxdepth 1 -type d)"
          f="$run_dir/20.databases/013.all-databases-2019.json"
          jq -e '(.databases_2019_options | length) > 0
                 and all(.databases_2019_options[]; (.accelerated_database_recovery | type) == "boolean")
                 and any(.databases_2019_options[]; .db_id == 2)' "$f" \
            || { jq . "$f"; exit 1; }
      - name: assert accelerated database recovery is skipped (2017)
        if: matrix.mssql == '2017-latest'
        run: |
          run_dir="$(find "$RUNNER_TEMP/out" -mindepth 1 -maxdepth 1 -type d)"
          test ! -f "$run_dir/20.databases/013.all-databases-2019.json"
          jq -e '[.skipped_scripts[]? | select(.script == "20.databases/013.all-databases-2019.sql")] | length >= 1' \
            "$run_dir/_run.json" \
            || { jq '[.skipped_scripts[]? | select(.script | test("013"))]' "$run_dir/_run.json"; exit 1; }
      # 9002, the log-full outage, is counted by its header line on both legs.
      # A row with a pattern and a numeric count is the whole contract: a
      # number dropped from @wanted loses the row, and a header literal that
      # failed to derive leaves occurrences null.
      - name: assert the log-full count in the error log summary
        run: |
          run_dir="$(find "$RUNNER_TEMP/out" -mindepth 1 -maxdepth 1 -type d)"
          f="$run_dir/10.system/040.error-log.json"
          jq -e '[.derived_patterns[] | select(.message_id == 9002)]
                 | length == 1 and (.[0].header_pattern | type) == "string"
                   and (.[0].occurrences | type) == "number"' "$f" \
            || { jq '.derived_patterns' "$f"; exit 1; }
      # The planted foreign key comes back untrusted and flagged, and is counted
      # apart. 032 exports server trigger source and runs only under
      # --include-object-definitions, which this run does not pass, so the run
      # records the skip rather than an empty file.
      - name: assert the not-for-replication flag and the server trigger gate
        run: |
          run_dir="$(find "$RUNNER_TEMP/out" -mindepth 1 -maxdepth 1 -type d)"
          f="$run_dir/70.schema/ci_probe/010.objects.json"
          jq -e '.counts.untrusted_foreign_keys_not_for_replication == 1
                 and ([.untrusted_constraints[] | select(.constraint_name == "fk_nfr_child_parent")
                       | .is_not_trusted == 1 and .is_not_for_replication == 1] == [true])
                 and all(.untrusted_constraints[]; has("is_not_for_replication"))' "$f" \
            || { jq '{counts, untrusted_constraints}' "$f"; exit 1; }
          test ! -f "$run_dir/40.security/032.server-trigger-definitions.json"
          jq -e '[.skipped_scripts[]? | select(.script == "40.security/032.server-trigger-definitions.sql")] | length == 1' \
            "$run_dir/_run.json" \
            || { jq '.skipped_scripts' "$run_dir/_run.json"; exit 1; }
      # 010, 060, 090 and 091 list the tables of one shared selection, capped
      # at 100 000 columns and 70 000 statistics. ci_probe is far below both,
      # so every list is whole, each count equals its total, and each root
      # carries the two caps. 030 caps its heaps at 100 000 and says how many
      # it saw: whole here too.
      - name: assert the schema listings are whole
        run: |
          run_dir="$(find "$RUNNER_TEMP/out" -mindepth 1 -maxdepth 1 -type d)"
          d="$run_dir/70.schema/ci_probe"
          caps='.listing_cap.columns == 100000 and .listing_cap.statistics == 70000'
          jq -e "$caps"' and (.tables | length) == .counts.tables
                 and .counts.tables_listed == .counts.tables
                 and any(.tables[]; .table == "dbo.ix_probe")' "$d/010.objects.json" \
            || { jq 'del(.tables, .object_counts)' "$d/010.objects.json"; exit 1; }
          jq -e "$caps"' and .tables_covered == .tables_total
                 and .columns_listed == .columns_total
                 and (.columns | length) == .columns_total' "$d/060.columns.json" \
            || { jq 'del(.columns)' "$d/060.columns.json"; exit 1; }
          jq -e "$caps"' and .tables_covered == .tables_total
                 and .statistics_listed == .statistics_total
                 and (.statistics | length) == .statistics_total
                 and (.statistics_all | length) == .statistics_total' "$d/090.statistics.json" \
            || { jq 'del(.statistics, .statistics_all)' "$d/090.statistics.json"; exit 1; }
          jq -e "$caps"' and .counts.statistics == (.density | length)
                 and .counts.statistics == .counts.statistics_total
                 and .counts.tables_covered == .counts.tables_total
                 and any(.density[]; .table == "ix_probe")' "$d/091.statistics-density.json" \
            || { jq 'del(.density)' "$d/091.statistics-density.json"; exit 1; }
          jq -e '.heaps_listing_cap == 100000 and (.heaps_total | type) == "number"
                 and .heaps_listed == .heaps_total
                 and (.heaps | length) == .heaps_total' "$d/030.index-operational.json" \
            || { jq 'del(.heaps, .contention, .page_compression)' "$d/030.index-operational.json"; exit 1; }
      # 040, 045 and 050 keep a cap and count what it would cut: ix_probe,
      # planted above with a primary key and two indexes, none compressed,
      # gives 040 rows to count; 045 and 050 find no columnstore and no heap
      # above 128 pages in ci_probe, so their counts are asserted as numbers
      # and against the list, which a renamed alias breaks.
      - name: assert the kept schema caps are counted
        run: |
          run_dir="$(find "$RUNNER_TEMP/out" -mindepth 1 -maxdepth 1 -type d)"
          d="$run_dir/70.schema/ci_probe"
          jq -e '.listing_cap == 2000 and .counts.uncompressed_indexes >= 3
                 and (.largest_uncompressed | length)
                     == ([.counts.uncompressed_indexes, .listing_cap] | min)' "$d/040.compression.json" \
            || { jq 'del(.largest_uncompressed)' "$d/040.compression.json"; exit 1; }
          jq -e '.listing_cap == 2000 and .listing_cap_trim_reasons == 2000
                 and (.counts.index_partitions | type) == "number"
                 and (.columnstore | length) == ([.counts.index_partitions, .listing_cap] | min)
                 and (.trim_reasons | length)
                     == ([.counts.trim_reason_rows, .listing_cap_trim_reasons] | min)' "$d/045.columnstore.json" \
            || { jq . "$d/045.columnstore.json"; exit 1; }
          jq -e '.sample.largest_heaps_scanned == 100
                 and (.counts.eligible_partitions | type) == "number"
                 and (.heaps | length) <= .counts.eligible_partitions' "$d/050.heaps.json" \
            || { jq . "$d/050.heaps.json"; exit 1; }
      # The planted log is found, read whole and classified: the REORGANIZE
      # without an end is listed open, with its operation and page count read
      # out of the command and ExtendedInfo, one later command, and the
      # finished run of the same index as its history; the finished run is
      # listed among the longest with two later commands and no other
      # completed run, since its own duration must not count as its history.
      # master has no log, and
      # its file says so rather than being absent, which is the widening to
      # the system databases at work on both legs.
      - name: assert the CommandLog history
        run: |
          run_dir="$(find "$RUNNER_TEMP/out" -mindepth 1 -maxdepth 1 -type d)"
          f="$run_dir/50.agent/ci_probe/050.commandlog.json"
          jq -e '.present == true and .missing_columns == 0 and .readable == true
                 and .error_number == null and .log.rows_read == 3
                 and .counts.alter_index_without_end == 1
                 and ([.commands[] | select(.is_open)
                       | .operation == "REORGANIZE" and .page_count == 50000
                         and .later_commands_same_database == 1
                         and .same_target.other_runs == 1 and .same_target.other_max_s == 3600]
                      == [true])
                 and ([.commands[] | select(.command_type == "ALTER_INDEX" and (.is_open | not))
                       | .is_longest and .duration_s == 3600
                         and .later_commands_same_database == 2
                         and .same_target.other_runs == 0 and .same_target.other_max_s == null]
                      == [true])' "$f" \
            || { jq . "$f"; exit 1; }
          jq -e '.present == false and .commands == []' "$run_dir/50.agent/master/050.commandlog.json" \
            || { jq . "$run_dir/50.agent/master/050.commandlog.json"; exit 1; }
      # The planted conversion is reported with the column it converts, named
      # as 70.schema names it, unbracketed: code and not region (the second
      # converted column), not @p (a converted parameter), two columns and not
      # four, and the length in bytes the plan carries, 40 for nvarchar(20).
      # No warning, because the seek survived the conversion. And no row names
      # a table variable as the converted table: showplan spells an aliased
      # one Table="@x" with no Database, and 10.system/040's @derived was
      # reported that way on the 2017 leg until 4 October 2026. The bounds
      # must account for the cut: the window filled no further than its cap
      # nor than the cache (a CI cache is far below 2 500, so a root that
      # reported the cap as the count would fail), and the candidates are the
      # matched statements up to their cap, so a candidate count that lost
      # track of matched fails here whatever the runner's cache holds.
      - name: assert the converted column in the implicit conversions
        run: |
          run_dir="$(find "$RUNNER_TEMP/out" -mindepth 1 -maxdepth 1 -type d)"
          f="$run_dir/80.workload/030.implicit-conversions.json"
          jq -e '[.conversions[] | select(.converted.table == "ic_probe")
                  | .database == "ci_probe" and .server_raised_warning == 0
                    and .converted.database == "ci_probe" and .converted.schema == "dbo"
                    and .converted.column == "code" and .converted.to_type == "nvarchar"
                    and .converted.to_length_bytes == 40
                    and .converted.columns_in_expression == 2] == [true]
                 and all(.conversions[]; (.converted.table // "") | startswith("@") | not)
                 and .bounds.examined_cap == 2500 and .bounds.candidate_cap == 1000
                 and .bounds.statements_examined <= .bounds.examined_cap
                 and .bounds.statements_examined <= .bounds.plans_in_cache
                 and .bounds.matched >= 1 and .bounds.matched <= .bounds.statements_examined
                 and .bounds.candidates == ([.bounds.matched, .bounds.candidate_cap] | min)' "$f" \
            || { jq . "$f"; exit 1; }
      # The two planted backups share a directory and are one destination,
      # and recent lists every backup of the window while it is under its cap,
      # which the root says. The error log's notable set reports its cap and
      # how many lines matched before it, and is listed newest first;
      # top_messages holds every prefix while there are fewer than its cap.
      # A fresh container logs configuration changes and database options,
      # so notable is not empty on either leg.
      - name: assert the backup destinations and the error log caps
        run: |
          run_dir="$(find "$RUNNER_TEMP/out" -mindepth 1 -maxdepth 1 -type d)"
          f="$run_dir/60.backup/010.history.json"
          jq -e '([.devices[] | select(.path == "/var/opt/mssql/data")
                   | .device_type == "disk" and .backups >= 2 and .device_names >= 2] == [true])
                 and .window.recent_cap == 2000 and .window.recent_capped == 0
                 and (.recent | length) == .window.backups_in_window' "$f" \
            || { jq '{window, devices}' "$f"; exit 1; }
          f="$run_dir/10.system/040.error-log.json"
          jq -e '.status.notable_cap == 200 and .status.notable_matched >= 1
                 and (.notable | length) == ([.status.notable_matched, .status.notable_cap] | min)
                 and ([.notable[].when] == ([.notable[].when] | sort | reverse))
                 and .status.top_messages_kept == 200
                 and (.top_messages | length) == ([.distinct_message_prefixes, .status.top_messages_kept] | min)' "$f" \
            || { jq '{status, distinct_message_prefixes, notable: [.notable[].when]}' "$f"; exit 1; }
      - name: assert the run is complete
        run: |
          run_dir="$(find "$RUNNER_TEMP/out" -mindepth 1 -maxdepth 1 -type d)"
          echo "run folder: $run_dir"
          find "$run_dir" -name '*.json' | sort
          test -f "$run_dir/_run.json"
          test "$(find "$RUNNER_TEMP/out" -maxdepth 1 -name '*.zip' | wc -l)" -eq 1
          for f in 020.properties 021.properties-2014 022.query-store 023.log-vlf 025.fragmentation 027.resumable-operations; do
            test -f "$run_dir/20.databases/ci_probe/$f.json"
          done
          # CURSOR_DEFAULT is what qualifies a DECLARE CURSOR without LOCAL or
          # GLOBAL in a module body, and nothing else in the archive carries
          # it. A boolean on every row, model included, and in the per-database
          # root: a renamed alias would leave the key absent and type null.
          jq -e '(.databases | length) > 0
                 and all(.databases[]; (.local_cursor_default | type) == "boolean")' \
            "$run_dir/20.databases/010.all-databases.json"
          jq -e '(.database.local_cursor_default | type) == "boolean"' \
            "$run_dir/20.databases/ci_probe/020.properties.json"
          # cdc explains log_reuse_wait = REPLICATION on a database that
          # publishes nothing; same shape, same reason for asserting the type.
          jq -e 'all(.databases[]; (.cdc | type) == "boolean")' \
            "$run_dir/20.databases/010.all-databases.json"
          # ci_probe never has a full backup, so the file carries a NULL base and
          # zero modified pages: the "no base" case, which is the one to keep
          # running on both legs. The allocated pages are required too, since
          # zero modified out of zero allocated would not tell the two
          # columns apart.
          jq -e '.base.time == null and .base.lsn == null and .base.guid == null
                 and .base.backup_found == 0
                 and .extents.allocated_pages > 0 and .extents.modified_pages == 0
                 and .counts.files_without_base == .counts.data_files' \
            "$run_dir/60.backup/ci_probe/030.differential-base.json" \
            || { jq . "$run_dir/60.backup/ci_probe/030.differential-base.json"; exit 1; }
          # 042 projects every cost band, empty ones included, in a fixed
          # order: a band that vanished when empty would make "nothing cost
          # this much" and "this band was not computed" look alike, and the
          # unknown band is the one a careless rewrite drops. Statements
          # examined never exceed the cap, and the bands account for all of
          # them, whatever the runner's cache holds. And some statement got a
          # cost: without the showplan namespace every path read returns NULL
          # and all of them land in unknown, which the sums alone accept.
          # Parallel is read from each plan, so a band never holds more
          # parallel statements than statements, and the count of serial
          # plans reporting max_dop above 1 is a number within the window.
          jq -e '([.bands[].band] == ["lt_5","5_25","25_50","50_100","100_500","ge_500","unknown"])
                 and all(.bands[]; .parallel_statements <= .statements
                                   and .parallel_executions <= .executions)
                 and (.examined.serial_plans_dop_above_1 | type) == "number"
                 and .examined.serial_plans_dop_above_1 <= .examined.statements
                 and .examined.cap == 1000 and .examined.statements <= .examined.cap
                 and ([.bands[] | select(.band != "unknown") | .statements] | add) > 0
                 and ([.bands[].statements] | add) == .examined.statements
                 and (.unknown.no_plan + .unknown.not_xml + .unknown.no_cost)
                       == (.bands[] | select(.band == "unknown") | .statements)' \
            "$run_dir/80.workload/042.parallel-cost-distribution.json" \
            || { jq '.' "$run_dir/80.workload/042.parallel-cost-distribution.json"; exit 1; }
          # 053 cuts the statements that passed its text prefilter down to
          # candidate_cap, and the cut has to show: matched is counted before
          # it and candidates after it, so the second is the first up to the
          # cap. The window is the cache up to its cap, never the cap itself
          # (a CI cache is far below a thousand statements). A read that
          # failed would leave every count at zero and pass the rest, so the
          # collection must report success.
          jq -e '.collected.plan_warnings == 1 and .errors.plan_warnings == 0
                 and .bounds.examined_cap == 1000 and .bounds.candidate_cap == 500
                 and .bounds.statements_examined <= .bounds.examined_cap
                 and .bounds.statements_examined <= .bounds.statements_in_cache
                 and .bounds.matched <= .bounds.statements_examined
                 and .bounds.candidates == ([.bounds.matched, .bounds.candidate_cap] | min)' \
            "$run_dir/80.workload/053.plan-warnings.json" \
            || { jq 'del(.statements)' "$run_dir/80.workload/053.plan-warnings.json"; exit 1; }
          # 040 read the database keys and the backup history inside TRY
          # blocks, so a typo in either dynamic statement would land in the
          # CATCH and leave an empty array that looks like an instance with
          # nothing encrypted. sa holds every permission, so both reads must
          # report success here, and the planted key must come back resolved
          # to its certificate with no private key backup. Each count must
          # agree with its array.
          jq -e '.encryption_keys.readable == true
                 and .backup_history.source == "backupset"
                 and .counts.certificates == (.certificates | length)
                 and .counts.database_keys == (.encrypted_databases | length)
                 and .counts.backup_encryptors == (.backup_encryptors | length)
                 and .counts.private_key_never_backed_up >= 1
                 and any(.encrypted_databases[]; .database == "ci_probe"
                         and .encryptor == "ci_tde_probe"
                         and (.encryptor_type | test("^CERTIFICATE"))
                         and .private_key_last_backup == null
                         and .encryption_state_desc == "UNENCRYPTED")
                 and all(.encrypted_databases[]; .database != "tempdb")' \
            "$run_dir/40.security/040.encryption-certificates.json" \
            || { jq '.' "$run_dir/40.security/040.encryption-certificates.json"; exit 1; }
          # 095 found the planted startup procedure, and its count agrees.
          jq -e '.startup_procedures_total == (.startup_procedures | length)
                 and any(.startup_procedures[]; .name == "ci_startup_probe")' \
            "$run_dir/10.system/095.master-user-objects.json" \
            || { jq '.' "$run_dir/10.system/095.master-user-objects.json"; exit 1; }
          # 080 lists what its root says is not Microsoft Corporation's, and
          # the two counts in the root account for every loaded module.
          jq -e '.counts.loaded > 0
                 and .counts.loaded == .counts.microsoft + .counts.other
                 and (.modules | length) == ([.counts.other, .listing_cap] | min)' \
            "$run_dir/10.system/080.loaded-modules.json" \
            || { jq '.' "$run_dir/10.system/080.loaded-modules.json"; exit 1; }
          # 025 ran on the user database, with its span resolved and the two
          # sides in its root, whatever the state of the store there.
          jq -e 'has("side_minutes") and has("before") and has("after")' \
            "$run_dir/80.workload/ci_probe/025.query-store-compare.json"
          jq -e '.config.query_store_compare_at | test("/")' "$run_dir/_run.json"
          # 014 gained the edition compute ceiling. Its KEY SETS are compared
          # exactly, like 027 below, and it is .processors and .numa that have
          # to be compared rather than the document root: the encoder builds an
          # object out of each dotted alias prefix, so the root's own keys stay
          # processors, numa, machine and nodes however many fields are added
          # underneath. An assertion on the root would assert nothing and would
          # go on passing while a field was dropped.
          #
          # What this cannot check is the table of per-edition limits. Both legs
          # of the matrix are Developer, which has no ceiling, so the signature
          # is none_observed and both limits are null here. The table is checked
          # against Microsoft's documentation and against nothing else, because
          # one instance knows one edition and a matrix of two knows the same
          # one twice. Saying so is better than an assertion that looks like it
          # covers the table and does not.
          #
          # maxdop_guidance is not compared against a literal, because the
          # runner's shape decides which of the four rows of Microsoft's table
          # answers and a literal would have to be revised the day the runners
          # grow a core. It is recomputed here from the per-node evidence the
          # same file publishes, which is a second implementation of the rule
          # written in another language over data the SQL never touched after
          # projecting it. It also pins the DAC exclusion: removing that line
          # from the query was measured to turn a guidance of 11 into 1, which
          # this catches. It does NOT pin the empty-node exclusion, and saying
          # so is the point of writing this down. Removing that line changes
          # nothing on an instance where every node carries a scheduler, which
          # is every instance this matrix will ever run on, so nothing here
          # guards it and only the header explains why it is there.
          jq -e '(.processors | keys_unsorted | sort) == (["affinity_type","cores_per_socket",
                     "cpus_lost_at_least","edition_cap_signature","edition_core_limit",
                     "edition_socket_limit","hyperthread_ratio","logical","schedulers",
                     "schedulers_offline","sockets"] | sort)
                 and (.numa | keys_unsorted | sort) == (["hardware_numa_present",
                     "maxdop_configured","maxdop_guidance","maxdop_guidance_basis",
                     "memory_node_count","memory_nodes_reported","scheduler_node_count",
                     "soft_numa_in_effect","softnuma_configuration",
                     "softnuma_configuration_desc","sqlos_node_count"] | sort)
                 and .processors.edition_cap_signature == "none_observed"
                 and .processors.edition_socket_limit == null
                 and .processors.edition_core_limit == null
                 and .processors.cpus_lost_at_least == 0
                 and .processors.schedulers_offline == 0
                 and .processors.affinity_type == "AUTO"
                 and ((.nodes | map(select((.state | test("DAC") | not)
                                           and .online_schedulers > 0))) as $n
                      | ($n | length) as $k
                      | ($n | map(.online_schedulers) | min) as $p
                      | $k >= 1
                        and .numa.maxdop_guidance_basis ==
                              (if   $k == 1 and $p <= 8 then "single_node_le_8"
                               elif $k == 1             then "single_node_gt_8"
                               elif $p <= 16            then "multiple_nodes_le_16"
                               else                          "multiple_nodes_gt_16" end)
                        and .numa.maxdop_guidance ==
                              (if   $k == 1 and $p <= 8 then $p
                               elif $k == 1             then 8
                               elif $p <= 16            then $p
                               else [($p / 2 | floor), 16] | min end))' \
            "$run_dir/10.system/014.cpu-topology.json" \
            || { jq '.' "$run_dir/10.system/014.cpu-topology.json"; exit 1; }
          # 010 sums failed_to_create_worker over the visible schedulers, and a
          # fresh container has created every worker it asked for: zero, not
          # null, which is what a dropped column or a lost cast would give.
          jq -e '.schedulers.failed_to_create_worker == 0' \
            "$run_dir/10.system/010.properties.json" \
            || { jq '.schedulers' "$run_dir/10.system/010.properties.json"; exit 1; }
          # 064 reads the worker pool out of every queryProcessing payload. The
          # engine posts a round within seconds of starting, so the ring is not
          # expected to be empty; where it holds rounds, the worker attributes
          # must have been read, and the peak must sit inside the pool. A
          # misspelled attribute reads NULL in silence, which only this sees.
          jq -e '.session.intervals == 0
                 or (any(.intervals[]; .max_workers > 0 and .workers_created > 0
                                       and .workers_created <= .max_workers)
                     and .session.max_workers > 0
                     and .session.workers_created_peak <= .session.max_workers)' \
            "$run_dir/10.system/064.server-diagnostics.json" \
            || { jq 'del(.waits)' "$run_dir/10.system/064.server-diagnostics.json"; exit 1; }
          # 078 carries the counters no other collector reads: a file that
          # lost whole objects fails the object checks, and one that dropped
          # its zeros, as 075 does on purpose, fails the zero check. Its root
          # and array come from one read of the view, so they must agree.
          jq -e '(.counters | length) == .counts.rows
                 and any(.counters[]; .value == 0)
                 and any(.counters[]; .counter == "Page Splits/sec")
                 and any(.counters[]; .object | test(":Locks$"))
                 and any(.counters[]; .object | test(":SQL Errors$"))
                 and any(.counters[]; .object | test(":Plan Cache$"))
                 and any(.counters[]; (.object | test(":Databases$")) and .instance == "ci_probe")
                 and any(.counters[]; (.object | test(":Buffer Manager$")) and .counter == "Page life expectancy"
                                      and .type_name == "PERF_COUNTER_LARGE_RAWCOUNT")
                 and all(.counters[]; (.object | test("Deprecated Features") | not) and .type_name != null)' \
            "$run_dir/10.system/078.performance-counters.json" \
            || { jq 'del(.counters)' "$run_dir/10.system/078.performance-counters.json"; exit 1; }
          # 026 counted the planted timeout as Aborted and the division by
          # zero as Exception. Counts alone are symmetric: a collector that
          # swapped the two types, or counted every non-regular row as both,
          # would still show one of each. So each statement is looked for in
          # its own listing and required to be absent from the other.
          jq -e '.executions.aborted >= 1 and .executions.exception >= 1
                 and any(.aborted[]; .text | test("COUNT_BIG"))
                 and all(.aborted[]; .text | test("object_id - object_id") | not)
                 and any(.exceptions[]; .text | test("object_id - object_id"))
                 and all(.exceptions[]; .text | test("COUNT_BIG") | not)' \
            "$run_dir/80.workload/ci_probe/026.query-store-interrupted.json" \
            || { jq -c '.results[] | select(.script == "80.workload/026.query-store-interrupted.sql")' "$run_dir/_run.json"
                 jq '{executions, aborted: [.aborted[]?.text], exceptions: [.exceptions[]?.text]}' \
                   "$run_dir/80.workload/ci_probe/026.query-store-interrupted.json"; exit 1; }
          # 020, 023 and 024 cap their listings at listing_cap and carry the
          # population the listing is taken from, so that a listing cut by the
          # cap reads as the head of the store. ci_probe's store is far below
          # the cap, so each listing must hold at least its population: a
          # listing cut short of it fails, and so does a count that went
          # missing (null would pass a comparison, hence the type checks).
          # At least, not exactly: the store captures ALL, so the collector's
          # own root statement enters it before the listing is read. Measured
          # on SQL Server 2025 with a fresh store: 023 counted 8 queries and
          # listed 9, 024 counted 12 and listed 13; a second run, the
          # collector's statements already known, matched exactly. 020's
          # counts.queries also holds queries with no runtime statistics,
          # which no listing ranks, so only the cap bounds its listings.
          jq -e '.listing_cap == 200
                 and (.counts.queries | type) == "number"
                 and (.counts.query_hashes | type) == "number"
                 and (.top_queries | length) >= 1
                 and (.top_queries | length) <= .listing_cap
                 and (.by_query_hash | length) <= .listing_cap' \
            "$run_dir/80.workload/ci_probe/020.query-store.json" \
            || { jq 'del(.top_queries, .by_query_hash)' "$run_dir/80.workload/ci_probe/020.query-store.json"; exit 1; }
          jq -e '.listing_cap == 200
                 and (.counts.queries | type) == "number" and .counts.queries >= 1
                 and (.counts.query_hashes | type) == "number"
                 and (.by_query | length) >= ([.counts.queries, .listing_cap] | min)
                 and (.by_query | length) <= .listing_cap
                 and (.by_query_hash | length) >= ([.counts.query_hashes, .listing_cap] | min)
                 and (.by_query_hash | length) <= .listing_cap' \
            "$run_dir/80.workload/ci_probe/023.query-store-most-executed.json" \
            || { jq '{listing_cap, counts, by_query: (.by_query | length), by_query_hash: (.by_query_hash | length)}' \
                   "$run_dir/80.workload/ci_probe/023.query-store-most-executed.json"; exit 1; }
          jq -e '.listing_cap == 200
                 and (.counts.queries | type) == "number" and .counts.queries >= 1
                 and (.by_query | length) >= ([.counts.queries, .listing_cap] | min)
                 and (.by_query | length) <= .listing_cap' \
            "$run_dir/80.workload/ci_probe/024.query-store-rowcount.json" \
            || { jq 'del(.by_query)' "$run_dir/80.workload/ci_probe/024.query-store-rowcount.json"; exit 1; }
          # 026, 028 and 060 cap their listings the same way. 026's root
          # counts the queries behind each listing, 028's the queries above
          # zero on at least one of its four measures, 060's the spilling
          # statements; each listing must be its population up to the cap.
          # The collector's own statements neither abort nor fail, and 028
          # counts and lists in one statement, so these two are exact; 060
          # compares with <= because the spill counters move between its two
          # reads of the cache.
          jq -e '.listing_cap == 200
                 and (.aborted | length) == ([.queries.with_aborted, .listing_cap] | min)
                 and (.exceptions | length) == ([.queries.with_exception, .listing_cap] | min)' \
            "$run_dir/80.workload/ci_probe/026.query-store-interrupted.json" \
            || { jq '{listing_cap, queries, aborted: (.aborted | length), exceptions: (.exceptions | length)}' \
                   "$run_dir/80.workload/ci_probe/026.query-store-interrupted.json"; exit 1; }
          jq -e '.listing_cap == 200
                 and (.by_query | length) == ([.counts.queries_eligible, .listing_cap] | min)' \
            "$run_dir/80.workload/ci_probe/028.query-store-resources.json" \
            || { jq 'del(.by_query, .waits)' "$run_dir/80.workload/ci_probe/028.query-store-resources.json"; exit 1; }
          jq -e '.listing_cap == 200
                 and (.top_spills | length) <= ([.statements.spilling, .listing_cap] | min)' \
            "$run_dir/80.workload/060.spills.json" \
            || { jq 'del(.top_spills)' "$run_dir/80.workload/060.spills.json"; exit 1; }
          # 027 shreds OptimizerStatsUsage out of the stored plans. ci_probe's
          # few user tables are barely queried, so statistics_used may be empty
          # here and an assertion on its contents would assert nothing. What is
          # checked instead is that the shred ran: plans were examined, and the
          # catalog statistics the corpus's own queries load were found and
          # excluded. That number being zero means the XML never parsed, which
          # is the way this collector fails silently.
          #
          # indexes_read is asserted on its contents, because one index was
          # planted read and one only maintained (above): the first must be
          # listed and the second must not, which is what fails if the shred
          # ever reads //Object instead of //RelOp/IndexScan/Object. Catalog
          # indexes are excluded and counted like catalog statistics, and
          # temporary ones (tempdb, table variables, the collector's own among
          # them) never reach the list.
          #
          # plans_examined must not exceed plans_total. The first version of the
          # file reported 116 against 115, because it counted the store twice a
          # second apart while capture mode ALL wrote the collector's own
          # statements into it. The pair is now taken from a pinned set and the
          # inequality is the cheapest guard that it stayed that way.
          #
          # The KEY SETS are asserted exactly, not probed for one bad name, and
          # an external reviewer is why. The first version of this block tested
          # `has("text") | not` on each row; the reviewer added a query text
          # column aliased [query_sql_text], and the archive shipped the
          # client's SQL while this assertion, go test and the grammar check
          # all stayed green. A guard that names the one column it expects to
          # be absent guards against that column. Comparing the whole key set
          # refuses ANY column nobody declared, which is the property wanted
          # here: this was the first Query Store collector without @discloses.
          #
          # The byte budget is asserted for its bookkeeping, since ci_probe's
          # plans are a few kilobytes and never reach it: every pinned plan is
          # either read or skipped, nothing is skipped here, the bytes read are
          # counted and stay under the budget, and plans_unparsed is now what
          # was read and did not parse, not what was pinned and did not parse.
          # A collector that forgot to count the plans it read, or stopped
          # before the budget, fails one of these.
          #
          # The sys exclusion is asserted the same way. On this probe database
          # statistics_used is legitimately empty, so the clause is vacuous
          # while the filter works and fails the moment it is removed, which is
          # the case it exists for.
          jq -e '(keys_unsorted | sort) == (["budget","cap","catalog_indexes_excluded","catalog_statistics_excluded",
                     "collected_at","database","indexes_named","indexes_read","plans_examined",
                     "plans_selected","plans_total","plans_unparsed","plans_with_index_reads",
                     "plans_with_usage","state","statistics_named","statistics_used",
                     "temporary_indexes_excluded","truncated","window"] | sort)
                 and (.state | keys_unsorted | sort) == (["actual","capture_mode","cleanup_mode",
                     "stale_threshold_days"] | sort)
                 and (.window | keys_unsorted | sort) == (["newest_execution","oldest_execution"] | sort)
                 and (.budget | keys_unsorted | sort) == (["bytes","bytes_read","duration_ms","plans_read",
                     "plans_skipped"] | sort)
                 and .budget.bytes == 209715200
                 and .budget.plans_read + .budget.plans_skipped == .plans_selected
                 and .budget.plans_skipped == 0
                 and .budget.bytes_read >= 1
                 and .budget.bytes_read <= .budget.bytes
                 and .budget.duration_ms >= 0
                 and .plans_unparsed == .budget.plans_read - .plans_examined
                 and .plans_total >= 1
                 and .plans_selected >= 1
                 and .plans_examined <= .plans_selected
                 and .plans_selected <= .plans_total
                 and .plans_unparsed >= 0
                 and .catalog_statistics_excluded >= 1
                 and .truncated == 0
                 and .cap == 2000
                 and .state.actual == "READ_WRITE"
                 and (.statistics_used | type) == "array"
                 and all(.statistics_used[]; (keys_unsorted | sort) == (["database","last_compile",
                     "max_modification_count","min_sampling_percent","plans","queries","schema",
                     "statistic","table"] | sort))
                 and all(.statistics_used[]; .schema != "sys" and (.table | startswith("sys.") | not))
                 and .catalog_indexes_excluded >= 1
                 and .plans_with_index_reads >= 1
                 and (.indexes_read | type) == "array"
                 and all(.indexes_read[]; (keys_unsorted | sort) == (["database","forced_plans","index_kind",
                     "index_name","last_compile","last_execution","plans","queries","schema",
                     "storage","table"] | sort))
                 and all(.indexes_read[]; .schema != "sys" and .database != null and .database != "tempdb")
                 and any(.indexes_read[]; .database == "ci_probe" and .schema == "dbo"
                         and .table == "dbo.ix_probe" and .index_name == "ix_probe_read")
                 and all(.indexes_read[]; .index_name != "ix_probe_written")' \
            "$run_dir/80.workload/ci_probe/027.query-store-stats-usage.json" \
            || { jq 'del(.statistics_used, .indexes_read) + {indexes_read: [.indexes_read[]? | .table + " " + .index_name]}' \
                   "$run_dir/80.workload/ci_probe/027.query-store-stats-usage.json"; exit 1; }
          # 029 is the second Query Store collector without @discloses, so its
          # key sets are asserted exactly for the reason given for 027 above:
          # a text or query id column added to either result set fails here.
          # The store of ci_probe was switched on in this job and has run
          # statements since, so at least one interval is listed, none is
          # longer than the store's own grain, and the listing respects its
          # cap. The function planted above must show as left out, and as left
          # out of the totals: its executions outnumber all the others (see the
          # plant), so totals that counted them would reach the excluded count.
          jq -e '(keys_unsorted | sort) == (["collected_at","config","database","intervals",
                     "listing_cap","state","window"] | sort)
                 and (.state | keys_unsorted | sort) == (["actual","capture_mode","desired"] | sort)
                 and (.config | keys_unsorted | sort) == (["interval_minutes","stale_threshold_days"] | sort)
                 and (.window | keys_unsorted | sort) == (["intervals","newest_interval","oldest_interval"] | sort)
                 and .listing_cap == 1488
                 and .state.actual == "READ_WRITE"
                 and .window.intervals >= 1
                 and (.intervals | type) == "array"
                 and (.intervals | length) >= 1
                 and (.intervals | length) <= .listing_cap
                 and all(.intervals[]; (keys_unsorted | sort) == (["cpu_ms","duration_ms","end_time",
                     "excluded","executions","logical_reads","logical_writes","minutes","open",
                     "physical_reads","start_time"] | sort)
                     and (.executions | keys_unsorted | sort) == (["aborted","exception","regular"] | sort)
                     and .minutes >= 1 and .minutes <= 1440)
                 and ([.intervals[].executions.regular] | add) >= 1
                 and ([.intervals[].excluded.nested_executions] | add) >= 1
                 and ([.intervals[].executions | .regular + .aborted + .exception] | add)
                     < ([.intervals[].excluded.nested_executions] | add)' \
            "$run_dir/80.workload/ci_probe/029.query-store-load-profile.json" \
            || { jq 'del(.intervals)' "$run_dir/80.workload/ci_probe/029.query-store-load-profile.json"
                 jq -c '.intervals[-3:]' "$run_dir/80.workload/ci_probe/029.query-store-load-profile.json"; exit 1; }
          # An `if`, not `cmd && { ... }`: this step runs under `set -e`, and a
          # grep that finds nothing exits 1, so the && form would turn the step
          # red exactly when the file is clean.
          if grep -q 'sqlserver/2004/07/showplan' \
               "$run_dir/80.workload/ci_probe/027.query-store-stats-usage.json"; then
            echo "027 emitted showplan XML" >&2
            exit 1
          fi
          # The run must have produced something, and _run.json must describe
          # what is actually on disk. That is the property worth guarding — an
          # archive whose record disagrees with its contents is the one failure
          # this tool exists to make impossible — and unlike a literal count it
          # stays true as the corpus grows.
          ok=$(jq '[.results[] | select(.status == "ok")] | length' "$run_dir/_run.json")
          echo "results recorded ok: $ok"
          test "$ok" -gt 0
          # Process substitution, not a pipe: a `while` on the right of a pipe
          # runs in a subshell, so its `exit 1` would leave the step green.
          while read -r rel; do
            test -e "$run_dir/$rel" || { echo "recorded but missing: $rel" >&2; exit 1; }
          done < <(jq -r '.results[] | select(.status == "ok") | .output' "$run_dir/_run.json")
          # One file per ok result. This equality holds because no collector in
          # this run writes a directory; the Query Store writers do, and they
          # are off here. Turning one on in CI means counting differently.
          on_disk=$(find "$run_dir" -name '*.json' ! -name '_run.json' | wc -l)
          echo "json files on disk: $on_disk"
          test "$on_disk" -eq "$ok"
              # Nothing blocks a CI run, so waits is empty here. Asserting that the
          # field is present and empty is still worth a line: it tells "nobody
          # waited" from an archive that never recorded any, and a nil slice
          # in Go marshals to null rather than [].
          # The blocking watch polls sys.dm_os_waiting_tasks on a connection of
          # its own: once before the first collector, then once a second while
          # each one runs. This is the only place its real query is executed,
          # bound as the code binds it. A statement that does not parse or bind
          # turns the watch off at that first poll, which the manifest records
          # and this catches.
          jq -e '.blocking_watch.enabled == true and .blocking_watch.stopped == ""
                 and (.blocking_watch.waits.items | length) == 0
                 and .blocking_watch.waits.truncated == false' "$run_dir/_run.json" \
            || { jq '.blocking_watch' "$run_dir/_run.json"; exit 1; }
      # 064 names the longest pending I/O of each ioSubsystem round, and no
      # instance has yet been seen filling that element: on 17.0.4065.4 it
      # comes as an empty <longestPendingRequests/> on every round, so the
      # columns are NULL in every collection and a misspelt path would read
      # NULL in silence for ever. The expressions of the ioSubsystem branch
      # are therefore taken from the file as written and run against a filled
      # payload. The element and attribute names are the ones SQLWATCH reads
      # (pendingRequest, @duration, @filePath); this pins the file to them and
      # checks that the longest request's file is the one returned, but it
      # cannot confirm the engine's own spelling, which no round has shown.
      - name: read 064's pending I/O paths against a filled payload
        run: |
          tools() { docker run --rm --network host mcr.microsoft.com/mssql-tools \
            /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "$SQL_PASSWORD" -b "$@"; }
          f=queries/10.system/064.server-diagnostics.sql
          cols=$(grep -A1 "= 'ioSubsystem'" "$f" | grep -o "THEN n\.value('[^']*', '[a-z0-9()]*')" \
                 | sed 's/^THEN //' | paste -sd, -)
          echo "expressions read: $cols"
          got=$(tools -I -h -1 -W -Q "SET NOCOUNT ON;
            DECLARE @x xml = N'<ioSubsystem ioLatchTimeouts=''0''><longestPendingRequests>
              <pendingRequest duration=''12'' filePath=''/data/a.mdf''/>
              <pendingRequest duration=''40'' filePath=''/log/a_log.ldf''/>
              <pendingRequest duration=''7'' filePath=''/data/tempdb.mdf''/>
              </longestPendingRequests></ioSubsystem>';
            SELECT CONCAT_WS('|', $cols) FROM @x.nodes('/ioSubsystem') AS t(n);")
          echo "read back: $got"
          test "$got" = "3|40|/log/a_log.ldf"
      # The bound's live tests, against the same container. They create
      # nothing: read-only instance collectors on master, and one missing
      # table that is never created. A separate step because some are
      # timing-sensitive (a bound of three seconds must outlast the
      # preamble). A live test skips when SQL_AUDITOR_LIVE_SERVER is unset,
      # and go test exits 0 on skips, so a SKIP fails the step.
      - name: max-duration live tests
        env:
          SQL_AUDITOR_LIVE_SERVER: localhost,1433
          SQL_AUDITOR_LIVE_USER: sa
          SQL_AUDITOR_LIVE_PASSWORD: ${{ env.SQL_PASSWORD }}
        run: |
          # The runner's bash is `bash -e`, without pipefail: without this
          # line the status of the pipe below is tee's, and a failing test
          # would leave the step green.
          set -o pipefail
          go test ./collect/ -run '^TestLiveMaxDuration' -count=1 -v | tee "$RUNNER_TEMP/maxdur.log"
          grep -q '^--- PASS' "$RUNNER_TEMP/maxdur.log"
          if grep -q '^--- SKIP' "$RUNNER_TEMP/maxdur.log"; then exit 1; fi
          if grep -q '^--- FAIL' "$RUNNER_TEMP/maxdur.log"; then exit 1; fi
